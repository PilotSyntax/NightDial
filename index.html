<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="NightDial"><meta name="description" content="Horloge de nuit analogique et numérique"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg?v=11" type="image/svg+xml"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=12"><title>NightDial — Horloge de nuit</title>
<style>
:root{color-scheme:dark;--color:#c8352f;--bright:.55;--dim:.4;--flip-top:#382544;--flip-mid:#473152;--flip-bottom:#1c1524;--flip-foreground:#f0d9ff;--flip-border:#6c4b7c;--flip-glow:#ad78df}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#bbb;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#clockArea{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:clamp(8px,2vh,18px);padding:calc(16px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom));cursor:pointer}
#clockFace{display:flex;align-items:center;justify-content:center;filter:brightness(var(--bright));opacity:calc(1 - var(--dim));max-width:100%;max-height:100%;min-width:0;min-height:0}
#dial{width:min(94vw,72dvh,640px);height:min(94vw,72dvh,640px);overflow:visible}
#dial .outer{stroke:var(--color);stroke-width:1;opacity:.45;fill:none}#dial .ticks line{stroke:var(--color);stroke-width:1.2;opacity:.48}#dial .ticks line.major{stroke-width:2.5;opacity:.8}#dial .numbers text{fill:var(--color);font-size:24px;font-family:inherit;font-weight:200;text-anchor:middle;dominant-baseline:middle}#dial .hand{stroke:var(--color);stroke-linecap:round}#dial .hour{stroke-width:9}#dial .minute{stroke-width:5}#dial .second{stroke-width:1.5;opacity:.5}#dial .hub{fill:var(--color)}
/* Flip clock: two split-flap panels inspired by the supplied bedside clock. */
#digital{display:none;align-items:center;justify-content:center;gap:clamp(8px,2.5vw,26px);width:min(96vw,920px);font-variant-numeric:tabular-nums}
#classicDigital{display:none;color:var(--color);font-size:min(27vw,170px);font-weight:700;line-height:1;letter-spacing:-.055em;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.flip-card{position:relative;isolation:isolate;width:min(44vw,435px);aspect-ratio:1.36;display:grid;place-items:center;overflow:hidden;border-radius:clamp(10px,3.2vw,28px);background:linear-gradient(180deg,var(--flip-top) 0%,var(--flip-mid) 47%,var(--flip-bottom) 50%,#0d0b12 100%);border:1px solid var(--flip-border);box-shadow:inset 0 2px 20px #ffffff13,inset 0 -14px 27px #0007,0 7px 26px #000b,0 0 28px var(--flip-glow)}
.flip-card::before{content:"";position:absolute;inset:0 0 50%;border-radius:inherit;background:linear-gradient(180deg,#9b7bb627,transparent 85%);pointer-events:none;z-index:1}
.flip-card::after{content:"";position:absolute;top:50%;left:0;right:0;height:2px;background:linear-gradient(90deg,#130e1a,#150f1cdd 20%,#130e19ee 80%,#0b0910);box-shadow:0 -1px #a78cc333,0 2px 5px #000a;z-index:3;pointer-events:none}
.flip-digits{font-family:Georgia,"Times New Roman",serif;font-size:clamp(70px,30vw,315px);font-weight:700;line-height:.95;letter-spacing:-.095em;padding-right:.08em;color:var(--flip-foreground);text-shadow:0 2px 0 #fff5,0 4px 9px var(--flip-glow),0 0 30px var(--flip-glow);transform:translateY(-.025em);white-space:nowrap}
.flip-card.changed .flip-digits{animation:flip-change .48s ease-in-out}
@keyframes flip-change{0%{transform:perspective(480px) rotateX(-11deg) translateY(-.025em);filter:brightness(.75)}60%{filter:brightness(1.2)}100%{transform:perspective(480px) rotateX(0) translateY(-.025em);filter:brightness(1)}}
@media(prefers-reduced-motion:reduce){.flip-card.changed .flip-digits{animation:none}}
body.flip-mode #date,body.flip-mode #weather{color:var(--flip-foreground)}

#info{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 16px;max-width:95vw;text-align:center}
#date{font-size:clamp(18px,4.4vw,27px);font-weight:500;letter-spacing:.045em;color:var(--color);filter:brightness(var(--bright));opacity:calc((1 - var(--dim)) * .65);text-transform:capitalize}
#weather{border:0;background:transparent;color:var(--color);font:500 clamp(18px,4.4vw,27px) -apple-system,sans-serif;filter:brightness(var(--bright));opacity:calc((1 - var(--dim)) * .75);padding:6px 4px;cursor:pointer}
#top{position:fixed;z-index:3;top:calc(14px + env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-size:11px;letter-spacing:.1em;opacity:.55}#top strong{color:var(--color);font-size:12px;letter-spacing:.2em}body.numeric-mode #top strong{display:none}
#panel{position:fixed;z-index:4;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(94vw,460px);background:rgba(21,21,24,.97);border:1px solid #333;border-radius:19px;padding:16px 18px 12px;box-shadow:0 8px 35px #000b;transition:opacity .25s,visibility .25s}#panel.hidden,#top.hidden{opacity:0;visibility:hidden;pointer-events:none}
button{border:0;color:#ddd;font-family:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #ddd;outline-offset:3px}.modes{display:flex;gap:7px}.modes button{background:#2b2b30;border-radius:11px;padding:11px 8px;font-size:12px;flex:1;min-width:0;white-space:nowrap}.modes button.active{background:#5c2525;color:white}
.settings{display:grid;grid-template-columns:125px minmax(0,1fr);align-items:center;gap:13px 8px;margin-top:17px;font-size:12px}.settings input[type=range]{width:100%;accent-color:#b83b36}.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.swatch{width:27px;height:27px;flex:0 0 27px;border-radius:50%;border:2px solid transparent}.swatch.active{outline:2px solid #ccc;outline-offset:2px}.swatch[data-color=red]{background:#c8352f}.swatch[data-color=amber]{background:#ce8127}.swatch[data-color=green]{background:#2e9a60}.swatch[data-color=blue]{background:#4a82eb}.swatch[data-color=violet]{background:#ad78df}.swatch[data-color=cyan]{background:#35bdc5}.swatch[data-color=pink]{background:#db6399}.swatch[data-color=white]{background:#e8e8ee}
.footer{font-size:11px;line-height:1.45;color:#8a8a91;margin-top:14px;display:flex;justify-content:space-between;gap:12px}.footer button{background:transparent;text-decoration:underline;color:#bbb;font-size:11px;padding:0}
#notice{position:fixed;z-index:5;top:calc(45px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:90vw;padding:9px 14px;background:#222;color:#ccc;border:1px solid #444;border-radius:8px;font-size:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}#notice.visible{opacity:1}
body.numeric-mode #clockArea,body.flip-mode #clockArea{gap:clamp(8px,2vh,16px)}body.numeric-mode #clockFace,body.numeric-mode #info,body.flip-mode #clockFace,body.flip-mode #info{width:100%}
@media(orientation:landscape){
#clockArea{flex-direction:row;gap:clamp(8px,2vw,24px);padding:calc(9px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
#dial{width:min(84dvh,66vw,640px);height:min(84dvh,66vw,640px)}#info{max-width:28vw;flex-direction:column}#date{max-width:28vw;font-size:clamp(15px,2.6vw,23px);letter-spacing:.02em}#weather{font-size:clamp(15px,2.6vw,23px)}
body.numeric-mode #clockArea,body.flip-mode #clockArea{flex-direction:column;gap:clamp(5px,2dvh,18px)}
body.numeric-mode #classicDigital{font-size:min(25vw,59dvh,230px)}
body.flip-mode #digital{width:min(94vw,1100px);gap:clamp(10px,2vw,28px)}body.flip-mode .flip-card{width:min(44vw,64dvh,515px);aspect-ratio:1.40}body.flip-mode .flip-digits{font-size:min(30vw,55dvh,340px)}
body.numeric-mode #info,body.flip-mode #info{max-width:100%;flex-direction:row;gap:10px 20px}body.numeric-mode #date,body.flip-mode #date{max-width:none}
#panel{left:auto;right:calc(12px + env(safe-area-inset-right));transform:none;width:min(43vw,380px);bottom:calc(9px + env(safe-area-inset-bottom));padding:12px 14px 9px}#panel .settings{gap:7px;margin-top:10px;grid-template-columns:100px minmax(0,1fr)}#panel .footer{margin-top:8px}#panel .modes button{padding:7px}
}

/* NightDial v10: clear seven-segment bedside alarm appearance */
body.flip-mode #clockFace{filter:brightness(max(.25,var(--bright)));opacity:1}
body.flip-mode #date,body.flip-mode #weather{color:#e6e7ee;filter:brightness(max(.5,var(--bright)));opacity:1}
#date{font-size:clamp(22px,5.25vw,36px);font-weight:600;letter-spacing:.005em;opacity:calc((1 - var(--dim)) * .95)}
#weather{font:600 clamp(22px,5.25vw,36px) -apple-system,BlinkMacSystemFont,sans-serif;opacity:calc((1 - var(--dim)) * .95)}
#info{gap:8px 18px;max-width:97vw}
.alarm-shell{width:min(93vw,990px);background:linear-gradient(170deg,#131419 0%,#050507 45%,#090a0e 100%);border-radius:clamp(18px,4vw,38px);border:2px solid #303038;box-shadow:inset 0 2px 3px #ffffff15,inset 0 -8px 24px #000,0 8px 35px #0009,0 0 23px var(--flip-glow);padding:clamp(9px,2vw,22px) clamp(14px,2.5vw,28px) clamp(10px,2vw,23px);position:relative;overflow:hidden}
.alarm-shell:before{content:"";position:absolute;inset:0 0 65%;background:linear-gradient(180deg,#ffffff0b,transparent);pointer-events:none}
.alarm-meta{position:relative;display:flex;justify-content:space-between;align-items:center;font-size:clamp(12px,2.4vw,20px);font-weight:750;letter-spacing:.025em;color:var(--flip-foreground);margin:0 5px 7px}
.alarm-status{letter-spacing:.06em}
#alarmSvg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 6px var(--flip-glow))}
#alarmSvg .lit{fill:var(--flip-foreground)}#alarmSvg .off{fill:#ffffff04}
body.flip-mode #digital{display:flex;align-items:center;justify-content:center;width:100%}
@media(orientation:landscape){
 body.flip-mode .alarm-shell{width:min(86vw,1040px);padding:8px 19px 10px}
 body.flip-mode #digital{width:100%}
 body.flip-mode #date,body.flip-mode #weather{font-size:clamp(18px,3vw,30px)}
}
</style></head>
<body><div id="top"><strong>NIGHTDIAL</strong><span id="wakeStatus">Écran éveillé : vérification…</span></div>
<main id="clockArea" aria-label="Horloge. Toucher pour afficher ou masquer les paramètres."><div id="clockFace">
<svg id="dial" viewBox="0 0 400 400" role="img" aria-label="Horloge analogique"><circle class="outer" cx="200" cy="200" r="195"/><g class="ticks" id="ticks"></g><g class="numbers" id="numbers"></g><line id="hourHand" class="hand hour" x1="200" y1="213" x2="200" y2="114"/><line id="minuteHand" class="hand minute" x1="200" y1="219" x2="200" y2="65"/><line id="secondHand" class="hand second" x1="200" y1="235" x2="200" y2="52" style="display:none"/><circle class="hub" cx="200" cy="200" r="5"/></svg>
<div id="classicDigital" role="timer" aria-live="off">00:00</div><div id="digital" role="timer" aria-live="off" aria-label="Heure">
<div class="alarm-shell">
  <div class="alarm-meta"><span id="alarmMeridiem">24H</span><span class="alarm-status" aria-hidden="true">Zzᶻ　♧</span></div>
  <svg id="alarmSvg" viewBox="0 0 840 300" role="img" aria-label="Chiffres à segments lumineux">
    <g id="segmentDigits"></g>
  </svg>
</div>
</div></div><div id="info"><div id="date"></div><button id="weather" type="button" title="Actualiser la température" aria-label="Température locale">☁ --°C</button></div></main>
<div id="notice" role="status"></div><section id="panel" aria-label="Réglages NightDial"><div class="modes"><button id="analog" class="active">◷ Analogique</button><button id="numeric">◫ Numérique</button><button id="flip">▣ Flip Clock</button></div><div class="settings"><span>Couleur</span><div class="swatches"><button class="swatch active" data-color="red" aria-label="Rouge nuit"></button><button class="swatch" data-color="amber" aria-label="Ambre"></button><button class="swatch" data-color="green" aria-label="Vert"></button><button class="swatch" data-color="blue" aria-label="Bleu"></button><button class="swatch" data-color="violet" aria-label="Violet"></button><button class="swatch" data-color="cyan" aria-label="Cyan"></button><button class="swatch" data-color="pink" aria-label="Rose"></button><button class="swatch" data-color="white" aria-label="Blanc doux"></button></div><label for="bright">Intensité visuelle</label><input type="range" id="bright" min="5" max="100" value="55"><label for="dim">Atténuation</label><input type="range" id="dim" min="0" max="95" value="40"><label for="wake">Maintenir éveillé</label><input type="checkbox" id="wake" checked><label for="seconds">Trotteuse</label><input type="checkbox" id="seconds"><label for="showWeather">Température</label><input type="checkbox" id="showWeather" checked></div><div class="footer"><span>Portrait + paysage • Mode nuit OLED<br>Toucher l'horloge pour afficher les réglages.</span><button id="hide">Masquer</button></div></section><script src="app.js" defer></script></body></html>

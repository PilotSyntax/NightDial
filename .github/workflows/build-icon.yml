name: Build iPhone touch icon
on:
  push:
    branches: [main]
    paths:
      - icon.svg
      - .github/workflows/build-icon.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert vector artwork to iPhone PNG
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for output, size in [('apple-touch-icon.png',180),('icon-512.png',512)]:
              cairosvg.svg2png(url='icon.svg',write_to=output,output_width=size,output_height=size)
          PY
      - name: Commit icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: generate PNG touch icons for iOS"
            git push
          fi
